<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuzzy Logic Risk Prediction</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-image: url("https://qtxasset.com/cdn-cgi/image/w=384,h=216,f=auto,fit=crop,g=0.5x0.5/https://qtxasset.com/quartz/qcloud5/media/image/Heart_health_Rasi%20Bhadramani_GettyImages-1290220631.jpg?VersionId=rZ0MhiIZT_ijVhQS9C7fOKiLCHfRdR.q");
            background-size: cover;
            background-position: center;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 30px;
            color: white; /* Set text color to white */
        }

        form {
            max-width: 300px; 
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-sizing: border-box;
        }

        button[type="submit"] {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        .result {
            text-align: center;
            margin-top: 20px;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Heart Disease Prediction</h1>
    
    <form method="post">
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required title="Enter your age in years"><br><br>

        <label for="cp">Chest Pain Type (0-3):</label>
        <input type="number" id="cp" name="cp" required title="0=typical, 1=atypical, 2=non-anginal, 3=asymptomatic"><br><br>

        <label for="thalach">Max Heart Rate:</label>
        <input type="number" id="thalach" name="thalach" required title="Enter maximum heart rate"><br><br>

        <label for="oldpeak">ST Depression:</label>
        <input type="number" step="0.1" id="oldpeak" name="oldpeak" required title="Enter ST depression value"><br><br>

        <button type="submit">Predict</button>
    </form>

    {% if risk is not none %}
    <h2>Risk Level: {{ risk }}</h2>
    <div class="result">
        {% if risk <= 0.5 %}
            <p>Congratulations! You are healthy. Please keep maintaining your health.</p>
        {% else %}
            <p>You have heart disease symptoms. Please go to the hospital to check up.</p>
        {% endif %}
    </div>
    {% endif %}
</body>
</html>
